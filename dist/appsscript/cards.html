<script>
/* ── 데이터 읽기 ── */
var DF_HEAD = CSV.trim().split('\n')[0].split(',');
var DF_ROWS = CSV.trim().split('\n').slice(1).map(function (l) { return l.split(','); });

function csvDownload() {
  var text = CSV.trim().replace(/\n/g, '\r\n') + '\r\n';
  var blob = new Blob([text], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'advertising.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
}
/** 어느 화면에서든 쓸 수 있는 내려받기 단추 */
function csvButton(cls) {
  return h('button', { class: 'btn green ' + (cls || ''), type: 'button', onclick: csvDownload },
    '⤓ advertising.csv 내려받기');
}
/** 속성의 뜻 표 */
function attrTable() {
  return tbl('', [h('tr', null, [
    h('th', { class: 'l' }, '속성'), h('th', { class: 'l' }, '설명'), h('th', null, '단위')
  ])].concat(ATTR_DESC.map(function (d) {
    return h('tr', null, [
      h('td', { class: 'l' }, attr(d[0])),
      h('td', { class: 'l', text: d[1] }),
      h('td', { text: d[2] })
    ]);
  })));
}

/* ── 캡처 카드 만들기 — STEP 마다 마지막 화면이다 ──
   ⚠ 등록 차례가 곧 학생이 넘기는 차례다. 각 STEP 카드 바로 뒤에서 부를 것. */
function shotCard(id, ch, step, no) {
  var key = 'img' + step;
  return REG({
    id: id, ch: ch, step: step, tag: '<small>STEP</small>' + step,
    title: 'STEP ' + step + ' 작업 화면 캡처',
    render: function (body) {
      body.appendChild(h('div', { style: 'height:100%;display:flex;flex-direction:column' }, [
        subT(no, '오렌지3 작업 화면을 캡처해 붙여 넣으세요.', '위젯 연결과 결과 창이 함께 보이게'),
        pasteBox(key),
        pasteTools(key)
      ]));
    }
  });
}

/* ── 1. 데이터셋 ── */
var dfPage = 0;
var DF_PER = 11;
REG({
  id: 'data', ch: 0, tag: '<small>DATA</small>CSV', title: '데이터셋 내려받기 · 살펴보기',
  render: function (body) {
    var tbody = h('tbody');
    var shape = h('span', { class: 'df-shape' });
    var pageTxt = h('span', { class: 'small muted' });
    function drawPage() {
      var total = Math.ceil(DF_ROWS.length / DF_PER);
      dfPage = Math.max(0, Math.min(total - 1, dfPage));
      var from = dfPage * DF_PER;
      fill(tbody, DF_ROWS.slice(from, from + DF_PER).map(function (r, i) {
        return h('tr', null, [h('th', { text: String(from + i) })]
          .concat(r.map(function (v) { return h('td', { text: v }); })));
      }));
      pageTxt.textContent = (dfPage + 1) + ' / ' + total + ' 쪽';
    }
    shape.textContent = DF_ROWS.length + ' rows × ' + DF_HEAD.length + ' columns';

    body.appendChild(h('div', { class: 'cols wide-r' }, [
      h('div', { class: 'col' }, [
        h('p', { class: 'lead', html: '아래 단추로 <b>advertising.csv</b> 를 내려받아 오렌지3의 ' +
          '<span class="w">File</span> 위젯에서 열어 보세요.' }),
        subT(null, '각 속성의 뜻', '한 행 = 한 시장에서의 광고비와 판매량'),
        attrTable(),
        h('p', { class: 'small muted', style: 'margin:8px 0 12px' },
          '예) 첫 번째 행 TV = 230.1 → TV 광고비 약 23만 100달러, Sales = 22.1 → 약 2만 2,100개 판매'),

        h('div', { class: 'df-head' }, [h('b', { class: 'small' }, '데이터 미리보기'), shape]),
        tbl('df', [h('thead', null, [h('tr', null, [h('th', { style: 'width:46px' })]
          .concat(DF_HEAD.map(function (x) { return h('th', { class: 'c-' + x, text: x }); })))]), tbody]),
        h('div', { class: 'row', style: 'margin-top:8px' }, [
          h('button', { class: 'btn small', type: 'button', onclick: function () { dfPage--; drawPage(); } }, '◀ 앞쪽'),

          h('button', { class: 'btn small', type: 'button', onclick: function () { dfPage++; drawPage(); } }, '뒤쪽 ▶'),
          h('button', { class: 'btn small', type: 'button', onclick: function () { dfPage = 0; drawPage(); } }, '처음으로')
        ])
      ])
    ]));
    drawPage();

        ]),
        adv.length ? h('p', { class: 'small muted', style: 'margin-top:2px' },
          '심화 ' + advDone + '/' + adv.length + (advDone ? '' : ' (안 해도 돼요)')) : null
      ]);
    });
    body.appendChild(h('div', { style: 'height:100%;display:flex;flex-direction:column' }, [
      h('p', { class: 'lead', html: '아래 단추를 누르면 <b>' + esc(ME ? ME.sid + ' ' + ME.name : '') +
        '</b> 이름으로 제출됩니다. 고친 뒤 다시 누르면 <b>가장 최근 답</b>으로 바뀌어 저장됩니다. ' +
        '(새 줄이 생기지 않아요)' }),
      h('div', { class: 'done-grid' }, cards.slice(0, 2)),
      h('div', { class: 'done-grid' }, cards.slice(2)),
      h('div', { class: 'row', style: 'margin-top:14px' }, [
        h('button', { class: 'btn primary big', type: 'button', id: 'submitBtn', onclick: submitAll }, '선생님께 제출하기'),
        h('span', { class: 's-msg', id: 'submitMsg' })
      ]),
      h('p', { class: 'small muted', style: 'margin-top:auto;margin-bottom:0' },
        '© 2026 티쳐무 · 모든 권리 보유. 학교 수업 목적으로만 이용해 주세요. ' +
        '학번과 이름만 사용하며 그 밖의 개인정보는 받지 않습니다. ' +
        '공용 컴퓨터라면 다 하고 나서 오른쪽 위 [나가기] 를 꼭 눌러 주세요.')
    ]));
  }
});
</script>
