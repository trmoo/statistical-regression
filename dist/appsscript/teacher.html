<!-- 교사 결과 보기 (주소 끝에 ?page=teacher) — © 2026 티쳐무 · 모든 권리 보유
     학생 화면과 달리 여기는 스크롤을 쓴다 — 서른 명을 한 표에서 보는 업무용 화면이고,
     교실 TV 가 아니라 선생님 모니터에서 열기 때문이다.
     ⚠ 정답표는 서버(Code.gs)가 암호를 확인한 뒤에만 내려 준다 — 학생 화면에는 들어가지 않는다. -->
<script>
var T = { pw: '', rows: [], key: {}, sel: null, loading: false, err: '', timer: null, imgs: {},
  size: 0 /* 반 인원 — 0 이면 「자동」 */ };
try { T.pw = sessionStorage.getItem(KEY + '-tpw') || ''; } catch (e) {}
try { T.size = Number(sessionStorage.getItem(KEY + '-tsize')) || 0; } catch (e) {}

function rowKey(d) { return d.sid + '|' + d.sname; }

/** 시각 한 칸 — 비어 있으면 「–」 */
function tTime(ms) {
  if (!ms) return '–';
  return new Date(ms).toLocaleString('ko-KR',
    { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}
/** 머리의 숫자 줄 — 들어온 학생 · 제출 · 작성 중 */
function countText() {
  var sent = T.rows.filter(function (d) { return d.status !== '작성 중'; }).length;
  return '들어온 학생 ' + T.rows.length + '명 · 제출 ' + sent + '명 · ' +
    '작성 중 ' + (T.rows.length - sent) + '명 · 30초마다 새로 고침';
}

/* ── 반별 제출 현황판 ──────────────────────────────────────────────
   「어느 출석번호가 아직 안 냈나」를 한눈에 본다.
   학번 끝 두 자리를 출석번호로, 그 앞을 반으로 읽는다
   (20315 → 2학년 3반 15번 · 1315 → 1학년 3반 15번).
   ⚠⚠ **들어오지 않은 학생은 시트에 줄이 아예 없다.** 그래서 빠진 번호를 세려면 반 인원을 알아야 하는데,
   이 앱은 명단을 받지 않으므로(개인정보) 기본값은 「자동」 = 그 반에서 본 가장 큰 번호다.
   뒷번호가 통째로 빠지면 자동으로는 알 수 없으니 선생님이 인원을 직접 고를 수 있게 두었다. */
function classOf(sid) {
  var s = String(sid || '').trim();
  if (!/^[0-9]{4,5}$/.test(s)) return null;
  return { key: s.slice(0, -2), no: Number(s.slice(-2)) };
}
/** 반 이름 — 키의 첫 자리가 학년, 나머지가 반 ('203' → 2학년 3반 · '13' → 1학년 3반) */
function classLabel(key) {
  return key.charAt(0) + '학년 ' + Number(key.slice(1)) + '반';
}
/** 칸 하나의 상태 — 안 들어옴 / 작성 중 / 제출 후 수정 / 제출함 */
function numState(d) {
  if (!d) return 'is-none';
  if (d.status === '제출 후 수정') return 'is-edit';
  if (d.status === '작성 중') return 'is-draft';
  return 'is-sent';
}
/** 출석번호 칸 하나 — 누르면 그 학생이 아래 자세히 보기로 열린다 */
function numChip(no, d) {
  var el = h('span', {
    class: 't-num ' + numState(d) + (d && rowKey(d) === T.sel ? ' is-sel' : ''),
    text: String(no),
    title: d ? d.sid + ' ' + d.sname + ' · ' + d.status : '아직 들어오지 않았습니다'
  });
  if (d) el.addEventListener('click', function () {
    T.sel = rowKey(d);
    renderT(); renderDetail();
    tDetail.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  return el;
}
/** 현황판 머리 — 반 인원 고르기와 색 안내 */
function boardTop() {
  var sel = h('select', null, [0, 20, 22, 24, 25, 26, 28, 30, 32, 35, 40].map(function (n) {
    return h('option', { value: String(n), selected: T.size === n || null }, n ? n + '명' : '자동');
  }));
  sel.addEventListener('change', function () {
    T.size = Number(sel.value) || 0;
    try { sessionStorage.setItem(KEY + '-tsize', String(T.size)); } catch (e) {}
    renderT();
  });
  return h('div', { class: 't-board-top' }, [
    h('b', null, '반 인원'), sel,
    h('span', null, '「자동」은 그 반에서 본 가장 큰 번호까지만 셉니다. 뒷번호가 통째로 빠졌다면 인원을 직접 골라 주세요.'),
    h('span', { class: 't-legend' }, [
      h('span', { class: 't-num is-sent' }, '제출'),
      h('span', { class: 't-num is-edit' }, '제출 후 수정'),
      h('span', { class: 't-num is-draft' }, '작성 중'),
      h('span', { class: 't-num is-none' }, '안 들어옴')
    ])
  ]);
}
function renderBoard() {
  var map = {}, odd = [];
  T.rows.forEach(function (d) {
    var c = classOf(d.sid);
    if (!c) { odd.push(d); return; }
    if (!map[c.key]) map[c.key] = {};
    map[c.key][c.no] = d;
  });
  var keys = Object.keys(map).sort();
  if (!keys.length && !odd.length) return null;

  var kids = [boardTop()];
  keys.forEach(function (key) {
    var seen = map[key];
    var nos = Object.keys(seen).map(Number);
    var size = T.size || Math.max.apply(null, nos);
    /* 1번부터 반 인원까지, 그 뒤에 인원보다 번호가 큰 학생(전학생 등)을 덧붙인다 */
    var list = [];
    for (var i = 1; i <= size; i++) list.push(i);
    nos.filter(function (n) { return n > size; })
      .sort(function (a, b) { return a - b; })
      .forEach(function (n) { list.push(n); });

    var sent = 0, draft = 0, miss = [];
    var chips = list.map(function (n) {
      var d = seen[n] || null;
      if (!d) miss.push(n);
      else if (d.status === '작성 중') draft++;
      else sent++;
      return numChip(n, d);
    });

    kids.push(h('div', { class: 't-cls' }, [
      h('div', { class: 't-cls-head' }, [
        h('b', null, classLabel(key)),
        h('span', null, '제출 ' + sent + '명 · 작성 중 ' + draft + '명 · 안 들어옴 ' +
          miss.length + '명 (반 인원 ' + size + '명 기준)')
      ]),
      h('div', { class: 't-nums' }, chips),
      h('p', { class: 't-miss' }, miss.length
        ? [document.createTextNode('아직 안 낸 번호 — '), h('b', { text: miss.join(', ') })]
        : [document.createTextNode('빠진 번호가 없습니다.')])
    ]));
  });
  if (odd.length) {
    kids.push(h('p', { class: 't-miss', text: '학번 모양이 달라 반을 가리지 못한 학생 ' +
      odd.length + '명 — ' + odd.map(function (d) { return d.sid; }).join(', ') }));
  }
  return h('div', { class: 't-board' }, kids);
}

/** 자동 채점 한 문항 — Code.gs 의 gradeOne_() 과 같은 규칙 */
function grade(k, v) {
  if (!(k in T.key)) return null;
  var ans = T.key[k];
  if (v === undefined || v === null || String(v).trim() === '') return false;
  var list = Array.isArray(ans) ? ans : [ans];
  for (var i = 0; i < list.length; i++) {
    var a = list[i];
    if (typeof a === 'number') {
      var x = Number(v);
      if (isFinite(x) && Math.abs(x - a) <= Math.max(0.011, Math.abs(a) * 0.01)) return true;
    } else if (String(v).trim() === String(a)) return true;
  }
  return false;
}
function answerText(k) {
  var a = T.key[k];
  if (a === undefined) return '';
  return Array.isArray(a) ? a.join(' / ') : String(a);
}
function keyedFields() {
  return FIELDS.filter(function (f) { return f[0] in T.key; });
}
/** 꼭 해야 하는 칸 — [심화](f[4])는 뺀다. 진행률의 분모다.
    ⚠ 심화를 넣으면 「안 해도 된다」고 해 놓고 진행률이 끝까지 안 차 선생님이 헷갈린다. */
function needFields() {
  return FIELDS.filter(function (f) { return !f[4]; });
}
function scoreOf(d) {
  var keyed = keyedFields();
  var need = needFields();
  return {
    ok: keyed.filter(function (f) { return grade(f[0], d[f[0]]); }).length,
    total: keyed.length,
    txt: FIELDS.filter(function (f) { return f[3] && String(d[f[0]] || '').trim(); }).length,
    txtTotal: FIELDS.filter(function (f) { return f[3]; }).length,
    /* 진행률 — 채점이 아니라 **얼마나 적었는가** 다. 작성 중인 학생을 보는 값이라 비어 있지만 않으면 센다. */
    done: need.filter(function (f) { return String(d[f[0]] || '').trim() !== ''; }).length,
    need: need.length
  };
}
/** 상태 알약 — 제출함 / 제출 후 수정 / 작성 중 */
function statusChip(d) {
  var s = d.status || '작성 중';
  var cls = s === '제출함' ? 'ok' : (s === '제출 후 수정' ? 'warn' : 'draft');
  return h('span', { class: 't-st ' + cls, text: s });
}

var tWrap, tBody, tDetail, tTools;
function startTeacher() {
  document.body.classList.add('t-mode');
  tTools = h('div', { class: 't-tools' });
  tBody = h('div');
  tDetail = h('section', { class: 't-box t-detail', hidden: true });
  tWrap = h('div', { class: 't-wrap' }, [
    h('section', { class: 't-box' }, [
      h('div', { class: 't-head' }, [h('h1', null, '학생 결과 보기'), tTools]),
      tBody
    ]),
    tDetail,
    h('p', { class: 'foot-copy', html: '광고비와 매출 학습지 · 교사 화면<br>' +
      '© 2026 티쳐무 · 모든 권리 보유. 학교 수업 목적으로만 이용해 주세요.' })
  ]);
  document.body.appendChild(tWrap);
  renderT();
  if (T.pw) loadT();
  clearInterval(T.timer);
  T.timer = setInterval(function () { if (!document.hidden && T.pw) loadT(); }, 30000);
}

function loadT() {
  if (!ONLINE || !T.pw || T.loading) return;
  T.loading = true;
  renderT();
  call('apiList', T.pw).then(function (j) {
    if (j && j.ok) {
      T.rows = j.rows || [];
      T.key = j.key || {};
      T.err = '';
      try { sessionStorage.setItem(KEY + '-tpw', T.pw); } catch (e) {}
    } else if (j && j.error === 'wrong_password') {
      T.err = '비밀번호가 맞지 않습니다.';
      T.pw = '';
      try { sessionStorage.removeItem(KEY + '-tpw'); } catch (e) {}
    } else {
      T.err = '결과를 불러오지 못했습니다.';
    }
  }).catch(function () {
    T.err = '서버에 이어지지 않았습니다. 웹 앱 주소로 열었는지 확인하세요.';
  }).then(function () {
    T.loading = false;
    renderT();
    renderDetail();
  });
}

function renderT() {
  if (!ONLINE) {
    fill(tTools, []);
    fill(tBody, [h('p', { class: 'tip' },
      '서버에 이어져 있지 않습니다. 앱스 스크립트 웹 앱 주소 끝에 ?page=teacher 를 붙여 열어 주세요.')]);
    return;
  }
  if (!T.pw) {
    fill(tTools, []);
    var pwIn = h('input', { type: 'password', placeholder: '비밀번호', autocomplete: 'current-password' });
    var form = h('form', { class: 't-login', onsubmit: function (e) {
      e.preventDefault(); T.pw = pwIn.value; T.err = ''; loadT();
    } }, [pwIn, h('button', { class: 'btn primary', type: 'submit' }, '열기')]);
    fill(tBody, [
      h('p', { class: 't-empty' }, '시트 메뉴 「② 교사 암호 정하기」에서 정한 비밀번호를 넣으세요.'),
      form,
      T.err ? h('p', { class: 'check warn', text: T.err }) : null
    ]);
    pwIn.focus();
    return;
  }

  fill(tTools, [
    h('span', { class: 's-msg', text: T.loading ? '불러오는 중…' : countText() }),
    h('button', { class: 'btn small', type: 'button', onclick: loadT }, '새로 고침'),
    h('button', { class: 'btn small', type: 'button', onclick: function () {
      T.pw = ''; T.rows = []; T.sel = null;
      try { sessionStorage.removeItem(KEY + '-tpw'); } catch (e) {}
      renderT(); renderDetail();
    } }, '잠그기')
  ]);

  if (T.err) { fill(tBody, [h('p', { class: 'check warn', text: T.err })]); return; }
  if (!T.rows.length) {
    fill(tBody, [h('p', { class: 't-empty', text: T.loading ? '' : '아직 들어온 학생이 없습니다.' })]);
    return;
  }

  var rows = T.rows.slice().sort(function (a, b) {
    return String(a.sid).localeCompare(String(b.sid), 'ko', { numeric: true });
  });
  var keyed = keyedFields();

  var table = h('table', { class: 't-list' }, [
    h('thead', null, [h('tr', null, [
      h('th', { class: 'l' }, '학번'), h('th', { class: 'l' }, '이름'),
      h('th', null, '상태'), h('th', null, '진행률'),
      h('th', null, '채점 문항 정답'), h('th', null, '서술 작성'),
      h('th', null, '캡처'), h('th', null, '제출 시각'), h('th', null, '마지막 움직임')
    ])]),
    h('tbody', null, rows.map(function (d) {
      var sc = scoreOf(d);
      var tr = h('tr', { class: (rowKey(d) === T.sel ? 'sel' : '') +
          (d.status === '작성 중' ? ' is-draft' : '') }, [
        h('td', { class: 'l', text: d.sid }),
        h('td', { class: 'l', text: d.sname }),
        h('td', null, statusChip(d)),
        h('td', null, [
          h('span', { class: 't-score', text: sc.done + '/' + sc.need }),
          h('span', { class: 't-bar' }, h('i', { class: 'go',
            style: 'width:' + (sc.need ? sc.done / sc.need * 100 : 0) + '%' }))
        ]),
        h('td', null, [
          h('span', { class: 't-score', text: sc.ok + '/' + sc.total }),
          h('span', { class: 't-bar' }, h('i', { style: 'width:' + (sc.total ? sc.ok / sc.total * 100 : 0) + '%' }))
        ]),
        h('td', { class: 't-score', text: sc.txt + '/' + sc.txtTotal }),
        h('td', { class: 't-score', text: Object.keys(d.imgs || {}).length + '/' + IMG_KEYS.length }),
        h('td', { text: tTime(d.submitAt) }),
        h('td', { text: tTime(d.savedAt || d.updatedAt) })
      ]);
      tr.addEventListener('click', function () {
        T.sel = rowKey(d);
        renderT(); renderDetail();
        tDetail.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      return tr;
    }))
  ]);

  fill(tBody, [
    renderBoard(),
    h('div', { style: 'margin-top:14px' }, table),
    h('details', { class: 'fold' }, [
      h('summary', null, '문항별 정답률'),
      h('div', { class: 't-rate' }, keyed.map(function (f) {
        /* ⚠ 정답률은 **제출한 학생만** 센다 — 아직 쓰고 있는 학생의 빈칸을 오답으로 세면
           수업 중에 정답률이 터무니없이 낮게 보인다. */
        var base = rows.filter(function (d) { return d.status !== '작성 중'; });
        if (!base.length) base = rows;
        var n = base.filter(function (d) { return grade(f[0], d[f[0]]); }).length;
        return h('span', null, [
          document.createTextNode(f[1] + ' '),
          h('b', { text: Math.round(n / base.length * 100) + '%' }),
          document.createTextNode(' (' + n + '/' + base.length + ')')
        ]);
      }))
    ])
  ]);
}

function renderDetail() {
  var d = T.rows.filter(function (r) { return rowKey(r) === T.sel; })[0];
  if (!T.pw || !d) { tDetail.hidden = true; fill(tDetail, []); return; }
  var sc = scoreOf(d);
  tDetail.hidden = false;

  var del = h('button', { class: 'btn small danger', type: 'button' }, '이 학생 기록 삭제');
  var armed = null;
  del.addEventListener('click', function () {
    if (!armed) {
      del.textContent = '정말 삭제할까요? 한 번 더 누르기';
      del.classList.add('arm');
      armed = setTimeout(function () {
        armed = null; del.textContent = '이 학생 기록 삭제'; del.classList.remove('arm');
      }, 3000);
      return;
    }
    clearTimeout(armed); armed = null;
    call('apiDelete', T.pw, d.sid).then(function (j) {
      if (!j || !j.ok) throw new Error('fail');
      T.sel = null; loadT();
    }).catch(function () { del.textContent = '삭제하지 못했습니다'; });
  });

  /* 비밀번호를 잊은 학생 — 해시만 지운다. 이름과 답안은 그대로 남는다. */
  var rst = h('button', { class: 'btn small', type: 'button' }, '비밀번호 초기화');
  var rArmed = null;
  rst.addEventListener('click', function () {
    if (!rArmed) {
      rst.textContent = '정말 초기화할까요? 한 번 더 누르기';
      rArmed = setTimeout(function () {
        rArmed = null; rst.textContent = '비밀번호 초기화';
      }, 3000);
      return;
    }
    clearTimeout(rArmed); rArmed = null;
    rst.textContent = '초기화하는 중…';
    call('apiResetPw', T.pw, d.sid).then(function (j) {
      rst.textContent = (j && j.ok) ? '✓ 초기화했습니다' : '계정이 없습니다';
    }).catch(function () { rst.textContent = '초기화하지 못했습니다'; });
  });

  var parts = [h('div', { class: 't-head' }, [
    h('h1', { style: 'font-size:21px', text: d.sid + ' ' + d.sname }),
    h('div', { class: 't-tools' }, [
      h('span', { class: 's-msg', text: '채점 문항 ' + sc.ok + '/' + sc.total }),
      rst,
      del,
      h('button', { class: 'btn small', type: 'button', onclick: function () {
        T.sel = null; renderT(); renderDetail();
      } }, '닫기')
    ])
  ])];

  [1, 2, 3, 4, 5].forEach(function (st) {
    parts.push(h('h3', { text: STEP_NAMES[st] }));
    parts.push(h('table', { class: 't-ans' }, [
      h('thead', null, [h('tr', null, [
        h('th', { class: 'l' }, '문항'), h('th', { class: 'l' }, '학생 답'),
        h('th', { class: 'l' }, '정답'), h('th', null, '채점')
      ])]),
      h('tbody', null, FIELDS.filter(function (f) { return f[2] === st; }).map(function (f) {
        var g = grade(f[0], d[f[0]]);
        return h('tr', null, [
          h('td', { text: f[1] }),
          h('td', { class: f[3] ? 'txt' : 'v', text: d[f[0]] === undefined ? '' : d[f[0]] }),
          h('td', { class: 'v', text: answerText(f[0]) }),
          h('td', { class: 'mk', html: g === null ? '' : g ? '<span class="mk-o">○</span>' : '<span class="mk-x">✕</span>' })
        ]);
      }))
    ]));
    IMG_KEYS.filter(function (p) { return p[2] === st; }).forEach(function (p) {
      var fid = (d.imgs || {})[p[0]];
      if (!fid) { parts.push(h('p', { class: 't-empty', text: p[1] + ': 없음' })); return; }
      var box = h('div', { class: 't-shot' }, h('span', { class: 's-msg', text: p[1] + ' 불러오는 중…' }));
      parts.push(box);
      var show = function (u) {
        fill(box, [
          h('img', { src: u, alt: '학생 캡처' }),
          h('a', { href: 'https://drive.google.com/file/d/' + encodeURIComponent(fid) + '/view',
            target: '_blank', rel: 'noopener' }, '드라이브에서 크게 보기')
        ]);
      };
      if (T.imgs[fid]) { show(T.imgs[fid]); return; }
      call('apiImage', T.pw, fid).then(function (j) {
        if (!j || !j.ok) throw new Error('fail');
        T.imgs[fid] = j.dataUrl;
        show(j.dataUrl);
      }).catch(function () {
        fill(box, [h('span', { class: 's-msg warn' }, '캡처를 불러오지 못했습니다.')]);
      });
    });
  });

  fill(tDetail, parts);
}
</script>
